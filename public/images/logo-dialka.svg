<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50" fill="none">
  <!-- DIALKA Official Vector Logo (Retina-Ready Vector Graphic) -->
  <defs>
    <linearGradient id="dialka-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <filter id="dialka-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Isotipo Oficial: Dial Metrológico Circular con Aguja y Escala -->
  <g filter="url(#dialka-shadow)">
    <circle cx="25" cy="25" r="19" fill="url(#dialka-grad)" />
    <circle cx="25" cy="25" r="15.5" stroke="#ffffff" stroke-width="1" stroke-opacity="0.35" fill="none" />
    <!-- Arco de escala -->
    <path d="M 14 25 A 11 11 0 1 1 36 25" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <!-- Marcas de calibración -->
    <path d="M 11.5 25 L 14 25 M 36 25 L 38.5 25 M 25 11.5 L 25 14" stroke="#fca5a5" stroke-width="1.8" stroke-linecap="round" />
    <!-- Aguja indicadora a 45 grados -->
    <line x1="25" y1="25" x2="33" y2="17" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" />
    <!-- Centro del dial -->
    <circle cx="25" cy="25" r="3.8" fill="#ffffff" />
    <circle cx="25" cy="25" r="1.8" fill="#991b1b" />
  </g>

  <!-- Tipografía Oficial DIALKA: DIAL (Negro Itálica) + KA (Rojo Corporativo Itálica) + ® -->
  <text x="52" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-style="italic" font-size="25" fill="#0f172a" letter-spacing="-0.5">DIAL<tspan fill="#991b1b">KA</tspan></text>
  <text x="145" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="9" fill="#991b1b">®</text>
  
  <!-- Subtítulo Institucional: BALANZAS Y SERVICIOS -->
  <text x="53" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="6.8" fill="#64748b" letter-spacing="1.8">BALANZAS Y SERVICIOS</text>
</svg>